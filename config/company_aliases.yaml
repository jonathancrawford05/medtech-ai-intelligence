# Hand-maintained applicant → resolved parent company lookup.
#
# The FDA lists the applicant exactly as filed, so one company appears under many
# spellings ("Siemens Medical Solutions USA, Inc.", "Siemens Healthineers AG"),
# and acquisitions mean yesterday's applicant belongs to today's parent.
#
# Automating M&A tracking is an explicit non-goal (development plan section 6):
# the trend report's own examples (Abbott/Laralab, Siemens Healthineers) need
# occasional human curation whatever the tooling. This file is that curation.
#
# Matching is on a normalised form of the applicant string: lowercased, with
# punctuation and common corporate suffixes (inc, ltd, llc, gmbh, co, corp, sa,
# ag, nv, bv, plc, kk, oy, ab, as, pty, srl, spa) removed. So one entry covers
# "Aidoc Medical Ltd", "Aidoc Medical, Ltd." and "AIDOC MEDICAL LTD".
#
# Because matching is EXACT on that normalised form (not fuzzy — see
# findings/0009 and ADR rationale: fuzzy matching silently swallows genuinely new
# values), spellings whose normalised form differs must be listed explicitly. The
# clearest case is the GE ultrasound division: "...Ultrasound and Primary Care
# Diagnostics" and "...Ultrasound & Primary Care Diagnostics" normalise
# differently (the "&" is dropped, "and" is not), so both appear below.
#
# `parent` is optional and records the current owner where it differs from the
# resolved name — the acquisition history the report cares about.
#
# Curation sweeps:
#   2026-09-06  initial ~20 applicants by volume.
#   2026-09-20  GE divisions merged; missed spellings of curated multinationals
#               added; long tail of single-company AI applicants consolidated.
#               Rationale, confidence and left-separate cases:
#               findings/0013-company-alias-sweep.md.

version: 1

