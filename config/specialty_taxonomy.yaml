# Curated mapping: FDA advisory-panel label -> our specialty category.
#
# The FDA's "Panel (lead)" field describes the reviewing advisory committee, not
# the clinical problem the device addresses. A cardiovascular-risk tool cleared
# through the Radiology panel is common, so panel alone cannot drive the
# mortality-relevant mart -- it is a starting signal that the evidence-enrichment
# stage refines.
#
# `default_category` catches panels we have not curated yet; anything landing
# there should be reviewed and promoted into `panels` explicitly.

version: 1
default_category: other

panels:
  Cardiovascular: cardiovascular
  Clinical Chemistry: metabolic
  Clinical Toxicology: metabolic
  # The FDA's own export misspells this panel. Curated explicitly rather than
  # fuzzy-matched: guessing at near-misses would silently swallow genuinely new
  # panels that the unmapped-panel report is meant to surface. See findings/0009.
  Clinical Toxcicology: metabolic
  Radiology: radiology
  Neurology: neurology
  Anesthesiology: critical_care
  Gastroenterology-Urology: gastroenterology
  General and Plastic Surgery: surgery
  General Hospital: general_hospital
  Hematology: hematology
  Immunology: immunology
  Microbiology: microbiology
  Molecular Genetics: genetics
  Obstetrics/Gynecology: obstetrics_gynecology
  Ophthalmic: ophthalmology
  Orthopedic: orthopedics
  Pathology: pathology
  Physical Medicine: physical_medicine
  Ear Nose & Throat: ent
  Dental: dental

# Categories the mortality-relevant gold mart treats as in-scope by default.
# See src/registry/mart/mortality_relevant.py (Phase 3).
mortality_relevant_categories:
  - cardiovascular
  - metabolic
