version: 1
# Stage 2 of ADR 0007 — the curated mortality/MACE relevance judgement.
#
# Scope: the 154 devices in specialty_category = 'cardiovascular' (see the Cowork
# handoff docs/handoffs/cowork-spike-and-curation.md). Every entry is a judgement about
# whether the device's INTENDED USE concerns predicting, stratifying or detecting risk of
# death or a major adverse cardiac event (MACE) — not merely whether the device touches
# the cardiovascular system.
#
# review_method is llm_assisted throughout: a Cowork session read each 510(k) Summary's
# Indications-for-Use text and formed the judgement (exactly the case ADR 0007 invented
# the label for). Jonathan can upgrade individual entries to `human` after review.
#
# intended_use_text is a verbatim excerpt of the Indications-for-Use statement, extracted
# from the 510(k) summary PDF text layer (pdf.js), whitespace-normalised and truncated to
# the leading sentence(s); intended_use_source is the authoritative PDF. See
# findings/0011-pdf-spike.md for extraction fidelity notes (the text layer occasionally
# splits glyphs).
#
# The inclusion rule (conservative, per ADR 0007/0014: under-inclusion is recoverable,
# over-inclusion is not): mortality_confirmed=true only where the intended use explicitly
# concerns risk of death, clinical deterioration, or an acute life-threatening event
# (hemodynamic instability, hemorrhage, cardiac arrest), OR quantifies coronary plaque
# burden (the handoff's named in-scope example). Devices that merely detect/diagnose a
# condition (arrhythmia, low EF, CAD, amyloidosis, pulmonary hypertension), monitor, or
# image are recorded false — with a note where the call was close. Devices whose summary
# yielded no clean verbatim intended-use text are OMITTED (absent = not reviewed), not
# guessed: see findings/0012-mortality-seed-curation.md for the omitted list.
