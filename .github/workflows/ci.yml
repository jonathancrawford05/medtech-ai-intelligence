name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never reach the FDA or openFDA; fixtures cover those paths.
  REGISTRY_LAKEHOUSE_ROOT: ./lakehouse

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Spark needs a JVM even in local mode. 17 matches Databricks Runtime 17.x.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Stage the Delta JARs once so the test run itself needs no Maven access.
      - name: Stage Delta JARs
        run: uv run python scripts/warm_delta_jars.py

      - name: Test
        # `live_network` tests hit the real FDA endpoints and never run in CI.
        run: uv run pytest -q -m "not live_network" --cov=src/registry --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          load: true
          tags: medtech-ai-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Phase 0 acceptance inside the image
        run: |
          docker run --rm -e REGISTRY_LAKEHOUSE_ROOT=/tmp/lakehouse \
            medtech-ai-intelligence:ci registry smoke
