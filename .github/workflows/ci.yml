name: CI

on:
  push:
    # Only the default branch. Feature branches are covered by `pull_request`;
    # listing both here made every PR commit trigger two identical runs, which
    # doubled cost and had the two Docker builds contend for the same GHA cache.
    # Accepted trade-off: a branch pushed with no PR open gets no CI signal
    # until a PR exists. Open a draft PR if you want CI on work in progress.
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly FDA-source drift check (Mondays 06:00 UTC). Only the live-network
    # job runs on this trigger; see its `if:` guard.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Tests must never reach the FDA or openFDA; fixtures cover those paths.
  REGISTRY_LAKEHOUSE_ROOT: ./lakehouse

jobs:
  test:
    # Skip on the weekly cron -- that trigger is only for the live-network job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Spark needs a JVM even in local mode. 17 matches Databricks Runtime 17.x.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Stage the Delta JARs once so the test run itself needs no Maven access.
      - name: Stage Delta JARs
        run: uv run python scripts/warm_delta_jars.py

      - name: Test
        # `live_network` tests hit the real FDA endpoints and never run in CI.
        # Coverage floor is conservative (non-Spark local run measured 72%);
        # ratchet it up toward the actual CI figure once observed here.
        run: >-
          uv run pytest -q -m "not live_network"
          --cov=src/registry --cov-report=term-missing --cov-fail-under=70

  docker:
    # Built on both architectures. amd64 is CI / Databricks parity; arm64 is what
    # Docker Desktop runs on Apple Silicon, so this is what actually substantiates
    # the arch-derived JAVA_HOME claim in CLAUDE.md (findings/0002).
    # Native runners, deliberately not QEMU: emulating a JVM test suite is 10-40x
    # slower and prone to emulation bugs, so a red job would tell us nothing.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          load: true
          tags: medtech-ai-intelligence:ci
          # Per-arch cache scopes. A shared scope makes the two legs thrash each
          # other's cache -- the same contention two concurrent builds hit before.
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - name: Phase 0 acceptance inside the image
        run: |
          docker run --rm -e REGISTRY_LAKEHOUSE_ROOT=/tmp/lakehouse \
            medtech-ai-intelligence:ci registry smoke
      - name: Report the architecture actually exercised
        run: |
          docker run --rm medtech-ai-intelligence:ci \
            python -c "import platform; print('container arch:', platform.machine())"
          docker run --rm medtech-ai-intelligence:ci \
            sh -c 'echo "JAVA_HOME=$JAVA_HOME -> $(readlink -f "$JAVA_HOME")"; java -version'

  docs:
    # Keep the growing doc set clean: style-lint Markdown and verify that internal
    # links (ADR cross-references, README links) resolve. External URLs are not
    # network-checked here -- that is deliberately out of scope to avoid flakiness.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Markdown style lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            docs/**/*.md
            findings/**/*.md
      - name: Check internal links resolve
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress *.md docs/**/*.md findings/**/*.md"
          fail: true

  live-network:
    # FDA-source drift check. Runs only on the weekly schedule or a manual dispatch,
    # never on push/PR -- it hits the real fda.gov endpoints. A failure means the
    # export URL, headers, or row count have drifted from ADR 0009's assumptions.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Live FDA fetch (parse only; no Spark/JVM needed)
        run: uv run pytest -q -m live_network
      - name: Dry-run ingest against the live list
        run: uv run registry ingest-fda-list --dry-run --verbose
